# Same package versions as docker.io/nhecker/scdownstream-scimilarity:0.3.0-1 (containers/scdownstream-scimilarity/Dockerfile).
# torch is the default PyPI build (CUDA 12 libraries, also runs on CPU), as in the image.
# zarr 2: scimilarity 0.3.0 tests isinstance(X.data, zarr.core.Array), which zarr 3 does not have.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::scanpy=1.11.4
  - conda-forge::anndata=0.12.2
  - conda-forge::pandas=2.3.2
  - conda-forge::numpy=2.2.6
  - conda-forge::pyyaml=6.0.2
  - conda-forge::hnswlib=0.8.0
  - conda-forge::zarr=2.18.7
  - conda-forge::numcodecs=0.15.1
  - conda-forge::pip
  - pip:
      - torch==2.8.0
      - scimilarity==0.3.0
      - captum==0.9.0
      - pytorch-lightning==2.6.6
      - tiledb==0.36.1
      - circlify==0.16.0
      - obonet==1.3.0
