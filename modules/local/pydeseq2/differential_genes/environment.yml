name: differential_genes
# Same package versions as docker.io/nhecker/scdownstream-tools:1.11.4-1 (containers/scdownstream-tools/Dockerfile)
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::anndata=0.12.2
  - conda-forge::pandas=2.3.2
  - conda-forge::numpy=2.2.6
  - conda-forge::scipy=1.16.1
  - conda-forge::scikit-learn=1.7.1
  - conda-forge::pyyaml=6.0.2
  - bioconda::pydeseq2=0.5.4
