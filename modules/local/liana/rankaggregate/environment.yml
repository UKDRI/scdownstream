# Same package versions as docker.io/nhecker/scanpy-report:1.11.4-coreinf0.4 (modules/local/scanpy/report/Dockerfile),
# limited to what rank_aggregate.py imports.
# Note: bioconda's liana package pulls more dependencies than the pip install in the image.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::scanpy=1.11.4
  - conda-forge::anndata=0.12.2
  - conda-forge::threadpoolctl=3.6.0
  - bioconda::liana=1.6.1
