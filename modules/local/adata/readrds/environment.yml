# Same package versions as docker.io/gcfntnu/scanpy:1.11.4 (image built 2025-08-26).
# The image installs anndata2ri from git main (>= 2.0) and rpy2, r-seurat and
# bioconductor-singlecellexperiment unpinned: those four pins are not checked against the image.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::anndata=0.12.2
  - conda-forge::pandas=2.3.2
  - conda-forge::rpy2=3.6.2
  - bioconda::anndata2ri=2.0.1
  - conda-forge::r-seurat=5.3.0
  - bioconda::bioconductor-singlecellexperiment=1.28.0
