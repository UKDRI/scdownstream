# Same package versions as docker.io/gcfntnu/scanpy:1.11.4 (scipy pin not checked against the image)
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::scanpy=1.11.4
  - conda-forge::anndata=0.12.2
  - conda-forge::numpy=2.2.6
  - conda-forge::scipy=1.16.1
  - conda-forge::pyyaml=6.0.2
