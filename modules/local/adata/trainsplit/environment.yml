# Same package versions as docker.io/gcfntnu/scanpy:1.11.4
# (scipy and scikit-learn: versions not confirmed against the image)
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::anndata=0.12.2
  - conda-forge::h5py=3.13.0
  - conda-forge::numpy=2.2.6
  - conda-forge::pandas=2.3.2
  - conda-forge::scipy=1.16.1
  - conda-forge::scikit-learn=1.7.1
  - conda-forge::threadpoolctl=3.6.0
  - conda-forge::pyyaml=6.0.2
