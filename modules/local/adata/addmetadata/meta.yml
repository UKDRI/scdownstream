name: "adata_addmetadata"
description: |
  Add per-sample metadata from a TSV to obs of an AnnData object. Rows are matched on
  obs["sample"] (set by ADATA_ADDSAMPLE); every other TSV column becomes an obs column.
  Numeric columns stay numeric, all others become categorical.
keywords:
  - single-cell
  - anndata
  - metadata
  - sample
tools:
  - "anndata":
      description: "Annotated data matrices in memory and on disk"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      doi: "10.21105/joss.04371"
      licence: ["BSD-3-Clause"]
  - "pandas":
      description: "Data analysis and manipulation library for Python"
      homepage: "https://pandas.pydata.org"
      documentation: "https://pandas.pydata.org/docs/"
      tool_dev_url: "https://github.com/pandas-dev/pandas"
      doi: "10.5281/zenodo.3509134"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: H5AD anndata object with an obs["sample"] column
        pattern: "*.h5ad"
  - - metadata:
        type: file
        description: |
          Tab-separated per-sample metadata with a header row. One row per sample; column
          names must be unique and must not already exist in obs.
        pattern: "*.{tsv,txt}"
  - - sample_col:
        type: string
        description: Name of the TSV column holding the sample ids matched against obs["sample"]

output:
  - h5ad:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.h5ad":
          type: file
          description: H5AD anndata object with the metadata columns added to obs
          pattern: "*.h5ad"

  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@nhecker"
maintainers:
  - "@nhecker"
