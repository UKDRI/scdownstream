name: "adata_addsample"
description: |
  Set obs["sample"] of an AnnData object to the sample id (meta.id). A pre-existing
  "sample" column with other values is kept as obs["sample_original"].
keywords:
  - single-cell
  - anndata
  - metadata
  - sample
tools:
  - "anndata":
      description: "Annotated data matrices in memory and on disk"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      doi: "10.21105/joss.04371"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information; meta.id is written to obs["sample"]
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: H5AD anndata object
        pattern: "*.h5ad"

output:
  - h5ad:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.h5ad":
          type: file
          description: H5AD anndata object with obs["sample"] set to meta.id (categorical)
          pattern: "*.h5ad"

  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@nhecker"
maintainers:
  - "@nhecker"
