name: celltypes_celltypist_train
# Same package versions as docker.io/nhecker/scanpy-ukdri-suite:1.11.4-1 (containers/scanpy-ukdri-suite/Dockerfile),
# as celltypes/celltypist
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.11
  - conda-forge::scanpy=1.11.4
  - conda-forge::anndata=0.12.2
  - conda-forge::pandas=2.3.2
  - conda-forge::numpy=2.2.6
  # celltypist 1.6.3 passes LogisticRegression(multi_class=...), which scikit-learn 1.8 removed
  - conda-forge::scikit-learn=1.7.1
  - conda-forge::threadpoolctl=3.6.0
  - bioconda::celltypist=1.6.3
